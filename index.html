<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cài app, hỗ trợ kỹ thuật · 9 Sạch</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0A261D">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="9 Sạch">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script>
/* Mở từ biểu tượng đã cài: chuyển thẳng vào trang chính */
(function(){var s=false;try{s=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches||navigator.standalone===true}catch(e){}
if(s&&!/[?&]stay=1/.test(location.search))location.replace("https://www.baocaonoibo.io.vn/")})();
</script>
<style>
:root{--g9:#0A261D;--g8:#103A2D;--g6:#1C634C;--gold:#C9A24B;--gold2:#E9D8A6;--bg:#EEF2EE;--ink:#14241D;--mut:#6A7B73;--line:#DCE4DE;--serif:'Playfair Display',Georgia,serif;--sans:'Be Vietnam Pro','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:980px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:18px}
.fr .wrap{padding-left:46px}
.hd{display:flex;align-items:center;gap:12px}
.hd img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 3px rgba(201,162,75,.35);flex:none}
.hd b{display:block;font:600 20px/1.15 var(--serif);color:var(--g8)}.hd small{font-size:13px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(10,38,29,.04),0 14px 30px -20px rgba(10,38,29,.25);padding:22px}
.card h3{font:600 20px var(--serif);color:var(--g8);margin-bottom:12px}
.tn{font-size:13.5px;color:var(--mut);line-height:1.6;margin:-6px 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;background:var(--g8);color:#fff;transition:background .2s,filter .2s}
.btn:hover{background:var(--g6)}
.btn.o{background:#fff;color:var(--g8);border:1px solid var(--line)}.btn.o:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(145deg,var(--gold),#B48A35);color:var(--g9);font-weight:600}.btn.gold:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.big{font-size:16px;padding:14px 22px}
.ins{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:14px 16px;padding:18px 22px;background:linear-gradient(135deg,#FFFAEF,#fff);border-color:#F1E2B8}
.ins .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--g8),var(--g6));color:var(--gold2)}.ins .ic svg{width:24px;height:24px}
.ins .tx b{display:block;font:600 16px var(--sans);color:var(--g9)}
.ins .tx span{display:block;font-size:13.5px;color:var(--mut);line-height:1.55;margin-top:2px}
.ins .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:700px){.ins{grid-template-columns:48px minmax(0,1fr) auto}.ins .ac{grid-column:auto}}
@media(max-width:699px){.ins .ac .btn{flex:1}}
#tech{display:flex;flex-direction:column;gap:18px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tl a{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14.5px;font-weight:500;color:var(--g9);transition:border-color .2s,transform .2s}
.tl a svg{color:var(--g6)}.tl a:hover{border-color:var(--gold);transform:translateY(-2px)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-14px);background:var(--g9);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== Popup cài đặt ===== */
.iov{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px 16px 96px;background:rgba(6,22,16,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.iov.on{opacity:1}
.isheet{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:28px;box-shadow:0 40px 90px -24px rgba(0,0,0,.65);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.iov.on .isheet{transform:none}
.ihd{display:flex;align-items:center;gap:14px;padding:24px 24px 18px;color:#fff;background:radial-gradient(320px 180px at 100% 0%,rgba(201,162,75,.35),transparent 62%),linear-gradient(135deg,var(--g9),var(--g8))}
.ihd img{width:60px;height:60px;border-radius:16px;background:#fff;object-fit:cover;flex:none}
.ihd b{display:block;font:600 20px/1.2 var(--serif)}.ihd small{display:block;font-size:12.5px;color:var(--gold2);margin-top:3px}
.ix{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}.ix:hover{background:rgba(255,255,255,.24)}
.ibd{padding:20px 24px 8px}
.ibd h4{font:600 18px/1.3 var(--serif);color:var(--g8);margin-bottom:6px}
.ibd p{font-size:14px;line-height:1.65;color:var(--mut)}
.ibn{list-style:none;display:flex;flex-direction:column;gap:11px;margin:14px 0 4px}
.ibn li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5}
.ibn li i{width:24px;height:24px;border-radius:50%;background:#EAF3EE;color:var(--g6);display:grid;place-items:center;flex:none}
.ibn li i svg{width:14px;height:14px;stroke-width:2.4}
.stps{list-style:none;display:flex;flex-direction:column;gap:16px;margin:14px 0 4px;counter-reset:s}
.stps>li{display:flex;gap:14px;align-items:flex-start;counter-increment:s}
.stps>li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--gold),#B48A35);color:var(--g9);font:700 15px var(--sans);display:grid;place-items:center;flex:none;margin-top:1px}
.stps .sx{flex:1;min-width:0;font-size:14.5px;line-height:1.55}
.mk{margin-top:9px;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:#F2F5F3;border:1.5px dashed #C9D6CE;font-size:14px;font-weight:500;color:var(--g9)}
.mk svg{width:24px;height:24px;color:#2F7BF6;flex:none}
.mk.hl{background:#FFF8E6;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,75,.18);animation:pls 1.8s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 0 8px rgba(201,162,75,.08)}}
.iact{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px 24px}
.iact .btn{flex:1;justify-content:center;min-width:130px}
.inote{margin:6px 24px 0;font-size:12.5px;color:var(--mut);line-height:1.6}
.okb{text-align:center;padding:10px 0 4px}
.okb .ck{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:#EAF3EE;color:var(--g6);display:grid;place-items:center}
.okb .ck svg{width:32px;height:32px;stroke-width:2.2}
.spn2{width:34px;height:34px;margin:6px auto 14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
/* Mũi tên chỉ vào nút thật của trình duyệt */
.ptr{position:fixed;z-index:130;color:var(--gold);pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12.5px var(--sans);text-align:center}
.ptr svg{width:46px;height:46px;stroke-width:2.6}
.ptr span{background:rgba(10,38,29,.92);color:var(--gold2);padding:5px 11px;border-radius:999px;white-space:nowrap}
.ptr.top{top:8px;animation:bu 1s ease-in-out infinite alternate}
.ptr.bot{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);animation:bd 1s ease-in-out infinite alternate}
.ptr.botr{bottom:calc(8px + env(safe-area-inset-bottom,0px));animation:bd 1s ease-in-out infinite alternate}
@keyframes bu{to{margin-top:-9px}}
@keyframes bd{to{margin-bottom:-9px}}
/* Hình thanh trình duyệt thu nhỏ: nút vàng nhấp nháy là nút cần bấm */
.mb{position:relative;height:96px;margin:10px 0 4px;border:2px solid #C9D6CE;border-radius:18px;background:#F2F5F3;overflow:hidden;display:flex;flex-direction:column}
.mb.bot{flex-direction:column-reverse}
.mb .bar2{display:flex;align-items:center;gap:4px;padding:7px 8px;background:#fff}
.mb.tp .bar2{border-bottom:1.5px solid var(--line)}
.mb.bot .bar2{border-top:1.5px solid var(--line);justify-content:space-between}
.mb .scr{flex:1;display:grid;place-items:center;font-size:12px;color:var(--mut)}
.mb .url{flex:1;min-width:0;background:#EEF2EE;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb .bi{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#7A8A82;font:400 22px/1 var(--sans);font-style:normal;flex:none}
.mb .bi svg{width:19px;height:19px}
.mb .bi.hl{background:var(--gold);color:var(--g9);box-shadow:0 0 0 4px rgba(201,162,75,.35);animation:pls 1.4s ease-in-out infinite}
.mbc{font-size:12.5px;color:var(--mut);line-height:1.5;margin:2px 0 6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><img class="lgo" alt="Logo 9 Sạch" width="46" height="46"><div><b>9 Sạch</b><small>Cài app, hỗ trợ kỹ thuật</small></div></header>
  <div class="card ins" id="insBox"></div>
  <div id="tech"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===== CẤU HÌNH ===== */
const SITE="www.baocaonoibo.io.vn",SITE_URL="https://www.baocaonoibo.io.vn/";
const SELF=location.origin+location.pathname;
const LOGO_URL="https://drive.google.com/thumbnail?id=1jvTZwz2rs6yOT-A7h3pyihV-yatTnxys&sz=w256";
const LOGO_FALLBACK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9A24B"/><stop offset="1" stop-color="#A8812F"/></linearGradient></defs><circle cx="48" cy="48" r="48" fill="url(#g)"/><text x="48" y="66" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="56" fill="#0A261D">9</text></svg>');
/* Danh sách link kỹ thuật: u:"" thì mục tự ẩn. Muốn thêm: thêm một dòng {t:"Tên",u:"https://..."} */
const TECH=[
 {h:"Phần mềm cần cài khi setup laptop",items:[
  {t:"App auto cài laptop",u:""},
  {t:"Ứng dụng văn phòng WPS Office",u:"https://www.wps.com/download/"},
  {t:"Google Chrome",u:"https://www.google.com/chrome/"},
  {t:"Zalo PC",u:"https://zalo.me/pc"},
  {t:"EVKey, phần mềm gõ tiếng Việt",u:"https://github.com/lamquangminh/EVKey/releases"},
  {t:"Nén 7-Zip",u:"https://www.7-zip.org/download.html"},
  {t:"Phần mềm chia ổ đĩa nhanh chóng",u:""}]},
 {h:"Hướng dẫn kỹ thuật",items:[
  {t:"Hướng dẫn cài laptop",u:""},
  {t:"Hướng dẫn cài đặt và sử dụng máy in",u:""}]},
 {h:"Bộ ứng dụng văn phòng",n:"Dùng bản có bản quyền của công ty. Nếu máy chưa có key, dùng WPS, LibreOffice hoặc Office trên web (miễn phí).",items:[
  {t:"Tải Microsoft Office 2019 (bản quyền công ty)",u:""},
  {t:"Hướng dẫn kích hoạt Office bằng key bản quyền",u:""},
  {t:"LibreOffice (miễn phí)",u:"https://www.libreoffice.org/download/download-libreoffice/"},
  {t:"Office trên web (miễn phí)",u:"https://www.office.com"}]}
];
/* ================================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 share:'<path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"/>',
 plus:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
 dots:'<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>',
 dotsh:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 inst:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 7v6M9 10.5l3 3 3-3M8 20h8M12 16v4"/>',
 tick:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 up:'<path d="M12 20V5M6 11l6-6 6 6"/>',
 dn:'<path d="M12 4v15M6 13l6 6 6-6"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
const svg=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}

/* Logo */
document.querySelectorAll('img.lgo').forEach(i=>{i.onerror=()=>{i.onerror=null;i.src=LOGO_FALLBACK};i.src=LOGO_URL});

/* ===== Nhận diện thiết bị ===== */
const UA=navigator.userAgent||"";
const IS_IOS=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_IPAD=/iPad/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
const IS_MAC=!IS_IOS&&/Macintosh|Mac OS X/i.test(UA);
const IS_FF=/Firefox|FxiOS/i.test(UA);
const IS_EDGE=/Edg\/|EdgiOS|EdgA\//.test(UA);
const IS_SAMSUNG=/SamsungBrowser/i.test(UA);
const IS_SAFARI=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|Edg\/|OPR|Android/i.test(UA);
const SAF=+((UA.match(/Version\/(\d+)/)||[])[1]||0);
const DEV_NAME=(IS_IOS||IS_ANDROID)?"điện thoại":"máy tính";
let IN_FRAME=false;try{IN_FRAME=window.top!==window}catch(e){IN_FRAME=true}
if(IN_FRAME)document.documentElement.classList.add('fr');
const isStandalone=()=>["standalone","minimal-ui","window-controls-overlay","fullscreen"].some(x=>matchMedia("(display-mode: "+x+")").matches)||navigator.standalone===true;
const IS_INAPP=!isStandalone()&&(/FBAN|FBAV|FB_IAB|Zalo|Instagram|Line\/|MicroMessenger|Messenger|Snapchat|TikTok|Viber|Telegram|; wv\)/i.test(UA)||(IS_IOS&&!/Safari\//.test(UA)));
const IS_CHROMIUM=!IS_IOS&&/Chrome|Chromium|Edg\/|OPR|SamsungBrowser/i.test(UA)&&!IS_INAPP;
const FLAG="ck9inst";
const getFlag=()=>{try{return localStorage.getItem(FLAG)==="1"}catch(e){return false}};
const setFlag=v=>{try{v?localStorage.setItem(FLAG,"1"):localStorage.removeItem(FLAG)}catch(e){}};
let installed=getFlag(),DEFERRED=null,INS_ST=null,INS_WAIT=0,DONE_ONCE=false;

/* ===== Danh sách kỹ thuật + banner ===== */
function renderTech(){
 $('tech').innerHTML=TECH.map(g=>{const it=g.items.filter(x=>x.u);if(!it.length)return'';
  return `<div class="card"><h3>${esc(g.h)}</h3>${g.n?`<p class="tn">${esc(g.n)}</p>`:''}<div class="tl">${it.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${svg('download')}<span>${esc(x.t)}</span></a>`).join('')}</div></div>`}).join('')}
function insInner(){return `<div class="ic">${svg('download')}</div><div class="tx"><b>Cài ứng dụng 9 Sạch về ${DEV_NAME}</b><span>Mở nhanh từ biểu tượng ngoài ${(IS_IOS||IS_ANDROID)?'màn hình chính':'màn hình máy tính'}, chạy toàn màn hình như một ứng dụng thật.</span></div><div class="ac"><button class="btn gold sm" data-ins="go">Cài ứng dụng</button><button class="btn o sm" data-ins="done">Đã cài rồi</button></div>`}
function refreshInstall(){const el=$('insBox');el.hidden=installed;el.innerHTML=insInner()}

/* ===== Popup cài đặt ===== */
const A_=(t,a,c)=>`<button class="btn ${c||'gold'} big" data-ia="${a}">${t}</button>`;
const CLOSE_BTN=`<button class="btn o big" data-ia="close">Để sau</button>`;
function closeInstall(){const o=$('iov');if(o){o.classList.remove('on');setTimeout(()=>o.remove(),250)}const p=$('ptr');if(p)p.remove();clearTimeout(INS_WAIT);INS_WAIT=0}
/* Tự đóng tab cài đặt. Nếu trình duyệt không cho đóng thì quay về trang chính */
function closeSelf(){closeInstall();try{window.close()}catch(e){}
 setTimeout(()=>{if(!window.closed&&!IN_FRAME)location.replace(SITE_URL)},600)}
/* Mũi tên: p='t' phía trên bên phải, 'b' phía dưới bên phải, 'c' phía dưới giữa.
   x = khoảng cách (px) từ mép PHẢI màn hình đến tâm nút cần bấm. Máy nào lệch thì chỉnh số x ở các dòng ar={...} bên dưới. */
function drawArrow(a){const o=$('ptr');if(o)o.remove();if(!a||IN_FRAME)return;
 const e=document.createElement('div');e.id='ptr';
 if(a.p==='c')e.className='ptr bot';
 else{e.className='ptr '+(a.p==='t'?'top':'botr');e.style.right=Math.max(2,a.x-23)+'px'}
 if(a.p!=='c')e.style.alignItems='flex-end';
 e.innerHTML=svg(a.p==='t'?'up':'dn')+'<span>'+(a.l||'Bấm ở đây')+'</span>';document.body.appendChild(e)}
function showInstall(body,acts,ar,note){
 closeInstall();
 const o=document.createElement('div');o.className='iov';o.id='iov';
 if(ar&&ar.p==='t'&&!IN_FRAME)o.style.paddingTop='96px';
 o.innerHTML=`<div class="isheet" role="dialog" aria-modal="true"><button class="ix" data-ic aria-label="Đóng">${svg('x')}</button><div class="ihd"><img id="iimg" alt=""><div><b>9 Sạch Checkin</b><small>${esc(SITE)}</small></div></div><div class="ibd">${body}</div>${note?`<p class="inote">${note}</p>`:''}<div class="iact">${acts}</div></div>`;
 document.body.appendChild(o);
 const im=o.querySelector('#iimg');im.onerror=()=>{im.onerror=null;im.src=LOGO_FALLBACK};im.src=LOGO_URL;
 o.addEventListener('mousedown',e=>{if(e.target===o)closeInstall()});
 o.addEventListener('click',e=>{const b=e.target.closest('[data-ic],[data-ia]');if(!b)return;if(b.hasAttribute('data-ic')){closeInstall();return}
  const a=b.dataset.ia;
  if(a==='native')runNative();
  else if(a==='copy')copyLink();
  else if(a==='chrome')openInChrome();
  else if(a==='close')closeSelf();
  else if(a==='done'){installed=true;setFlag(true);refreshInstall();closeSelf()}});
 drawArrow(ar);
 requestAnimationFrame(()=>o.classList.add('on'))}
function copyLink(){
 const ok=()=>toast('Đã sao chép. Hãy dán vào thanh địa chỉ của Safari hoặc Chrome');
 const fb=()=>{const t=document.createElement('textarea');t.value=SITE_URL;t.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(t);t.focus();t.select();try{t.setSelectionRange(0,999)}catch(e){}let r=false;try{r=document.execCommand('copy')}catch(e){}t.remove();if(r)ok();else toast('Hãy giữ vào dòng liên kết để sao chép')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(SITE_URL).then(ok).catch(fb);else fb()}
function openInChrome(){const i='intent://'+SITE+'/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(SITE_URL)+';end';try{window.open(i,'_top')}catch(e){location.href=i}}
const BEN=`<ul class="ibn"><li><i>${svg('tick')}</i><span>Mở nhanh bằng biểu tượng 9 Sạch ngay trên màn hình</span></li><li><i>${svg('tick')}</i><span>Chạy toàn màn hình như ứng dụng thật</span></li><li><i>${svg('tick')}</i><span>Luôn là phiên bản mới nhất, không tốn dung lượng</span></li></ul>`;
const mk=(ic,txt,hl)=>`<div class="mk${hl?' hl':''}">${svg(ic)}<span>${txt}</span></div>`;
function stepsHTML(title,list,intro){return `<h4>${title}</h4>${intro?`<p>${intro}</p>`:''}<ol class="stps">${list.map(x=>`<li><div class="sx">${x}</div></li>`).join('')}</ol>`}
function lkBox(){return `<div class="mk" style="justify-content:space-between;border-style:solid;font-weight:600;word-break:break-all"><span style="user-select:all;-webkit-user-select:all">${esc(SITE)}</span><button class="btn gold sm" data-ia="copy">Sao chép</button></div>`}
/* Hình thanh trình duyệt thu nhỏ. p: 'tp' thanh trên, 'bot' thanh dưới. Phần tử bắt đầu bằng * là nút cần bấm (vàng nhấp nháy). */
function mock(p,items,cap){
 const bi=x=>{const h=x[0]==='*',k=h?x.slice(1):x;
  if(k==='u')return `<span class="url">${SITE}</span>`;
  const g={b:'‹',f:'›',book:'▤',tabs:'❐',share:svg('share'),dots:svg('dots'),dotsh:svg('dotsh'),menu:svg('menu'),plus:svg('plus')}[k]||'';
  return `<i class="bi${h?' hl':''}">${g}</i>`};
 return `<div class="mb ${p}"><div class="bar2">${items.map(bi).join('')}</div><div class="scr">Trang 9 Sạch</div></div><p class="mbc">${cap||'Bấm vào nút vàng đang nhấp nháy.'}</p>`}

/* Đang mở trong Zalo, Facebook, Messenger...: hướng dẫn mở bằng trình duyệt chính */
function inAppGuide(){
 const br=IS_IOS?'Safari':'Chrome',nm=/Zalo/i.test(UA)?'Zalo':'ứng dụng này',dt=IS_IOS?'⋯':'⋮';
 const hd=`<div style="display:flex;align-items:center;gap:8px;margin-top:9px;padding:9px 12px;border-radius:12px;background:#0068FF;color:#fff;font-size:13px"><span>✕</span><b style="flex:1">${nm}</b><span class="mk hl" style="margin:0;padding:2px 12px;background:#FFF8E6;color:#14241D;font-size:18px">${dt}</span></div>`;
 showInstall(stepsHTML('Mở bằng '+br+' để cài ứng dụng',[
  `Bấm nút <b>${dt}</b> (ba chấm) ở góc trên bên phải của ${nm}.${hd}`,
  `Chọn <b>Mở bằng trình duyệt</b> (hoặc <b>Mở bằng ${br}</b>).${mk('globe','Mở bằng trình duyệt',1)}`,
  `Trang mở ra trong ${br}, bấm lại <b>Cài ứng dụng</b> và làm theo hướng dẫn.`],`${nm} không cho cài ứng dụng trực tiếp.`)+`<p style="margin-top:14px;font-size:14px;color:var(--mut)">Không thấy mục đó? Sao chép liên kết rồi dán vào ${br}:</p>${lkBox()}`,
  A_('Sao chép liên kết','copy')+(IS_ANDROID?A_('Mở bằng Chrome','chrome','o'):'')+`<button class="btn o big" data-ic>Đóng</button>`)}

function renderInstall(){
 const A=A_;
 const rot=(IS_IOS||IS_ANDROID)&&!IS_IPAD&&innerWidth>innerHeight;
 const rn=rot?'Hãy xoay điện thoại thẳng đứng để thấy đúng vị trí nút. ':'';
 /* Chrome, Edge, Samsung... có hộp thoại cài một chạm thật */
 if(DEFERRED)return showInstall(`<h4>Cài ứng dụng ngay</h4><p>Bấm nút dưới, chọn <b>Cài đặt</b> trong hộp thoại hiện ra.</p>${BEN}`,A('Cài đặt ngay','native')+CLOSE_BTN);
 /* iPhone, iPad */
 if(IS_IOS){
  const cr=/CriOS/.test(UA);
  if(!IS_SAFARI&&!cr)return showInstall(`<h4>Hãy mở bằng Safari</h4><p>Trình duyệt này trên iPhone không cho cài ứng dụng. Sao chép liên kết, mở Safari rồi dán vào thanh địa chỉ.</p>${lkBox()}`,A('Sao chép liên kết','copy')+CLOSE_BTN);
  let s1,ar;
  if(cr){s1='Bấm nút <b>Chia sẻ</b> ở bên phải thanh địa chỉ phía trên.'+mock('tp',['u','*share']);ar={p:'t',x:36}}
  else if(IS_IPAD){s1='Bấm nút <b>Chia sẻ</b> ở thanh trên cùng, phía bên phải.'+mock('tp',['b','f','u','*share','plus','tabs']);ar={p:'t',x:118}}
  else if(SAF>=26){s1='Bấm nút <b>⋯</b> ở bên phải thanh phía dưới, rồi chọn <b>Chia sẻ</b>.'+mock('bot',['u','*dotsh']);ar={p:'b',x:34}}
  else{s1='Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở giữa thanh phía dưới.'+mock('bot',['b','f','*share','book','tabs']);ar={p:'c'}}
  return showInstall(stepsHTML('Cài trên '+(IS_IPAD?'iPad':'iPhone'),[s1,`Kéo menu lên, chọn <b>Thêm vào Màn hình chính</b>.${mk('plus','Thêm vào Màn hình chính',1)}`,`Bấm <b>Thêm</b> ở góc trên bên phải. Biểu tượng 9 Sạch xuất hiện trên màn hình chính.`]),A('Tôi đã cài xong','done')+CLOSE_BTN,rot?null:ar,rn+'Không thấy thanh công cụ? Vuốt trang xuống nhẹ hoặc chạm vào mép dưới màn hình để nó hiện ra.')}
 /* Mac Safari */
 if(IS_MAC&&IS_SAFARI)return showInstall(stepsHTML('Cài trên Mac (Safari)',[`Trên thanh menu phía trên màn hình, chọn <b>Tệp</b>.`,`Chọn <b>Thêm vào Dock…</b>${mk('plus','Thêm vào Dock…',1)}`,`Bấm <b>Thêm</b>.`]),A('Tôi đã cài xong','done')+CLOSE_BTN,null,'Cần macOS Sonoma (14) trở lên.');
 /* Firefox máy tính */
 if(IS_FF&&!IS_ANDROID)return showInstall(`<h4>Trình duyệt này chưa hỗ trợ</h4><p>Firefox trên máy tính không cho cài ứng dụng web. Hãy mở bằng <b>Chrome</b> hoặc <b>Edge</b>.</p>${lkBox()}`,A('Sao chép liên kết','copy')+CLOSE_BTN);
 /* Chrome, Edge... chưa có sự kiện cài: đợi vài giây rồi chuyển sang hướng dẫn tay */
 if(IS_CHROMIUM&&!INS_ST){
  showInstall(`<div class="okb"><div class="spn2"></div><h4>Đang chuẩn bị bản cài đặt…</h4></div>`,CLOSE_BTN);
  INS_ST='wait';INS_WAIT=setTimeout(()=>{INS_ST='tried';if($('iov'))renderInstall()},5000);return}
 /* Hướng dẫn tay theo từng trình duyệt */
 const edgA=/EdgA\//.test(UA);let t,st,ar=null;
 if(IS_ANDROID&&IS_SAMSUNG){t='Cài trên Android (Samsung Internet)';ar={p:'b',x:30};
  st=[`Bấm nút menu <b>≡</b> ở góc dưới bên phải.`+mock('bot',['b','f','book','tabs','*menu']),`Chọn <b>Thêm trang vào</b>, rồi <b>Màn hình chính</b>.${mk('plus','Thêm trang vào',1)}`,`Bấm <b>Thêm</b>.`]}
 else if(IS_ANDROID&&IS_FF){t='Cài trên Android (Firefox)';ar={p:'t',x:24};
  st=[`Bấm menu <b>⋮</b> ở góc trên bên phải.`+mock('tp',['u','tabs','*dots']),`Chọn <b>Cài đặt</b> hoặc <b>Thêm vào màn hình chính</b>.${mk('inst','Cài đặt',1)}`,`Bấm <b>Thêm</b>.`]}
 else if(IS_ANDROID&&edgA){t='Cài trên Android (Edge)';ar={p:'c'};
  st=[`Bấm nút <b>⋯</b> ở giữa thanh phía dưới.`+mock('bot',['b','plus','*dotsh','tabs','book']),`Chọn <b>Thêm vào điện thoại</b>, rồi <b>Màn hình chính</b>.${mk('plus','Thêm vào điện thoại',1)}`,`Bấm <b>Thêm</b>.`]}
 else if(IS_ANDROID){t='Cài trên Android (Chrome)';ar={p:'t',x:24};
  st=[`Bấm menu <b>⋮</b> ở góc trên bên phải.`+mock('tp',['u','tabs','*dots']),`Chọn <b>Thêm vào màn hình chính</b> (hoặc <b>Cài đặt ứng dụng</b>).${mk('plus','Thêm vào màn hình chính',1)}`,`Bấm <b>Thêm</b>, nếu hiện hộp nữa thì bấm <b>Thêm tự động</b>.`]}
 else if(IS_EDGE){t='Cài trên máy tính (Edge)';
  st=[`Bấm menu <b>···</b> ở góc trên bên phải.`+mock('tp',['u','*dotsh']),`Chọn <b>Ứng dụng</b>, rồi <b>Cài đặt trang này dưới dạng ứng dụng</b>.${mk('inst','Cài đặt trang này dưới dạng ứng dụng',1)}`,`Bấm <b>Cài đặt</b>.`]}
 else{t='Cài trên máy tính (Chrome)';
  st=[`Tìm biểu tượng cài đặt ở cuối thanh địa chỉ (hình màn hình có mũi tên xuống).`+mock('tp',['u','*inst','dots']),`Nếu không thấy, bấm menu <b>⋮</b> → <b>Truyền, lưu và chia sẻ</b> → <b>Cài đặt trang dưới dạng ứng dụng</b>.`,`Bấm <b>Cài đặt</b>.`]}
 showInstall(stepsHTML(t,st),A('Tôi đã cài xong','done')+CLOSE_BTN,rot?null:ar,rn)}
/* Nút Cài ứng dụng: trong khung thì mở tab mới, đứng riêng thì hiện popup */
function openTab(){const u=SELF+'?install=1';let w=null;try{w=window.open(u,'_blank')}catch(e){}
 if(!w)showInstall(`<h4>Mở trang cài đặt</h4><p>Bấm nút dưới, trang cài đặt sẽ mở ở tab mới.</p>`,`<a class="btn gold big" href="${esc(u)}" target="_blank">Mở trang cài đặt</a><button class="btn o big" data-ic>Để sau</button>`)}
function openInstall(){INS_ST=null;
 try{
  if(IS_INAPP)return inAppGuide();
  if(IN_FRAME)return openTab();
  renderInstall();
 }catch(e){showInstall(`<h4>Mở bằng trình duyệt để cài</h4><p>Sao chép liên kết, dán vào Safari hoặc Chrome rồi bấm lại Cài ứng dụng.</p>${lkBox()}`,`<button class="btn o big" data-ic>Đóng</button>`)}}
function finishOk(){if(DONE_ONCE)return;DONE_ONCE=true;installed=true;setFlag(true);refreshInstall();
 showInstall(`<div class="okb"><div class="ck">${svg('tick')}</div><h4>Đã cài xong</h4><p>Mở ứng dụng bằng biểu tượng <b>9 Sạch</b> trên ${(IS_IOS||IS_ANDROID)?'màn hình chính':'Desktop hoặc menu Start'}. Tab này sẽ tự đóng.</p></div>`,`<button class="btn big" data-ia="close">Đóng tab này</button>`);
 setTimeout(closeSelf,1800)}
async function runNative(){
 const d=DEFERRED;if(!d){INS_ST='tried';renderInstall();return}
 DEFERRED=null;
 try{d.prompt();const c=await d.userChoice;if(c&&c.outcome==='accepted'){finishOk();return}}catch(e){}
 INS_ST='tried';renderInstall()}

/* ===== Sự kiện ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-ins]');if(!b)return;
 if(b.dataset.ins==='go')openInstall();
 else if(b.dataset.ins==='done'){installed=true;setFlag(true);refreshInstall();toast('Đã ẩn mục cài ứng dụng')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInstall()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(INS_ST==='wait'&&$('iov')){clearTimeout(INS_WAIT);INS_ST=null;renderInstall()}});
window.addEventListener('appinstalled',()=>{DEFERRED=null;if(!IN_FRAME&&$('iov'))finishOk();else{installed=true;setFlag(true);refreshInstall()}});
let RZI;addEventListener('resize',()=>{clearTimeout(RZI);RZI=setTimeout(()=>{if($('ptr')&&$('iov')&&INS_ST!=='wait')renderInstall()},300)});
if("serviceWorker" in navigator&&!IN_FRAME&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ===== Khởi động ===== */
renderTech();refreshInstall();
/* Mở với ?install=1 (từ nút Cài ứng dụng của trang chính): hiện popup ngay */
if(/[?&]install=1/.test(location.search)&&!IN_FRAME){try{history.replaceState(null,'',location.pathname)}catch(e){}
 setTimeout(openInstall,500)}
</script>
